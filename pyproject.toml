[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mliphub"
version = "0.1.0"
description = "Local metadata and provenance recording for machine-learning interatomic potentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
ase = ["ase>=3.23"]
dev = ["ase>=3.23", "pytest>=8", "build>=1", "jsonschema>=4"]

[project.scripts]
mliphub = "mliphub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
